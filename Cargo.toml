[package]
name = "tool"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.31", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# The safetensors native fuzz harness lives in fuzz/ as its own crate. Excluded here so
# `cargo build` never pulls safetensors/libfuzzer-sys into the shipping tool; serde and
# serde_json are deliberately shared for the typed target-profile trust boundary.
[workspace]
exclude = ["fuzz"]
